version: '3'
services:
  work_order:
    container_name: work_order
    build:
      context: .
      dockerfile: .docker/php/Dockerfile.dev
    ports:
      - 9001:80
    volumes:
      - .:/var/www/
    working_dir: /var/www/
    env_file:
      - .env
    restart: unless-stopped
    #network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UID: ${UID:-1001}
      GID: ${GID:-1001}
    networks:
      - work-order-network
    depends_on:
      - work_order_db

  work_order_db:
    container_name: work_order_db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: work_order
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    command: --server-id=2 --relay-log=mysql-relay-bin --read-only=1
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - work-order-network

networks:
  work-order-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local