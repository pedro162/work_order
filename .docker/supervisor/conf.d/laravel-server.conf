[program:laravel-serve]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan serve --host=0.0.0.0 --port=80
stdout_logfile=/var/www/storage/logs/supervisor.log
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stopwaitsecs=3600
stderr_logfile=/var/www/storage/logs/laravel-serve.err.log
stdout_logfile=/var/www/storage/logs/laravel-serve.out.log
